# Checks every push and pull request on Linux: types, lint, formatting, unit tests,
# colour contrast, and the end-to-end suite driving the real app under a virtual display.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, lint, format and unit tests
        run: npm run check

      - name: Colour contrast (WCAG AA)
        run: npm run contrast

      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npm run test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
